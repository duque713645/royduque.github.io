<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Roy Duque — IT Support Analyst portfolio, resume, technical skills, experience, and professional recognition."
  >

  <title>Roy Duque | IT Support Analyst</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  >


  <style>

    :root{
      --bg:#07111f;
      --panel:#0d1b2d;
      --panel2:#101f33;
      --text:#eef5ff;
      --muted:#9fb0c5;
      --line:#20334a;
      --accent:#55b7ff;
      --accent2:#7c6cff;
      --max:1120px;
      --radius:18px;
    }


    *{
      box-sizing:border-box;
    }


    html{
      scroll-behavior:smooth;
    }


    body{
      margin:0;
      background:radial-gradient(
        circle at 80% 0%,
        #152b49 0,
        #07111f 38%
      );
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      line-height:1.6;
    }


    a{
      color:inherit;
      text-decoration:none;
    }


    .container{
      width:min(var(--max),calc(100% - 40px));
      margin:auto;
    }


    /* NAVIGATION */

    nav{
      position:sticky;
      top:0;
      z-index:10;
      background:rgba(7,17,31,.82);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(159,176,197,.12);
    }


    .nav-inner{
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }


    .brand{
      font-weight:800;
      letter-spacing:-.03em;
    }


    .brand span{
      color:var(--accent);
    }


    .links{
      display:flex;
      gap:24px;
      color:var(--muted);
      font-size:14px;
    }


    .links a:hover{
      color:var(--text);
    }


    /* HERO */

    .hero{
      padding:100px 0 80px;
      display:grid;
      grid-template-columns:1.4fr .6fr;
      gap:60px;
      align-items:center;
    }


    .eyebrow{
      font:600 12px "JetBrains Mono",monospace;
      color:var(--accent);
      letter-spacing:.12em;
      text-transform:uppercase;
    }


    h1{
      font-size:clamp(44px,7vw,76px);
      line-height:.98;
      letter-spacing:-.055em;
      margin:14px 0 22px;
    }


    .hero h1 span{
      display:block;
      color:#b8c8dc;
    }


    .lead{
      font-size:19px;
      color:var(--muted);
      max-width:700px;
    }


    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:30px;
    }


    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 17px;
      border-radius:12px;
      border:1px solid var(--line);
      font-weight:700;
      font-size:14px;
    }


    .btn.primary{
      background:var(--accent);
      color:#03101d;
      border-color:var(--accent);
    }


    .btn:hover{
      transform:translateY(-1px);
    }


    /* TERMINAL */

    .terminal{
      background:linear-gradient(
        145deg,
        #0d1b2d,
        #091523
      );

      border:1px solid var(--line);

      border-radius:var(--radius);

      padding:22px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.25);
    }


    .dots{
      display:flex;
      gap:7px;
      margin-bottom:18px;
    }


    .dots i{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#38506c;
    }


    pre{
      margin:0;
      white-space:pre-wrap;
      font:500 13px/1.8 "JetBrains Mono",monospace;
      color:#c5d6e9;
    }


    .blue{
      color:var(--accent);
    }


    .purple{
      color:#a69cff;
    }


    .green{
      color:#8fe1b5;
    }


    /* SECTIONS */

    section{
      padding:78px 0;
      border-top:1px solid rgba(159,176,197,.10);
    }


    .section-head{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:end;
      margin-bottom:28px;
    }


    h2{
      font-size:34px;
